appId: com.codexw.edgememo
productName: EdgeMemo
directories:
  buildResources: resources
  output: dist
files:
  - out/**
extraResources:
  - from: resources
    to: resources
asarUnpack:
  - resources/**
win:
  target:
    - nsis
  icon: resources/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: EdgeMemo-Setup-${version}.${ext}
  shortcutName: EdgeMemo
